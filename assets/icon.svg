<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#313244" stroke-width="8" />

  <!-- Waveform lines in background -->
  <g opacity="0.45" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round">
    <line x1="110" y1="210" x2="110" y2="302" />
    <line x1="150" y1="170" x2="150" y2="342" />
    <line x1="190" y1="230" x2="190" y2="282" />
    <line x1="322" y1="230" x2="322" y2="282" />
    <line x1="362" y1="170" x2="362" y2="342" />
    <line x1="402" y1="210" x2="402" y2="302" />
  </g>

  <!-- Microphone Icon -->
  <g filter="url(#glow)">
    <!-- Capsule -->
    <rect x="216" y="130" width="80" height="150" rx="40" fill="url(#accentGrad)" />
    <!-- Stand Arc -->
    <path d="M 186 230 A 70 70 0 0 0 326 230" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Stand Base -->
    <line x1="256" y1="300" x2="256" y2="370" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <line x1="206" y1="370" x2="306" y2="370" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
